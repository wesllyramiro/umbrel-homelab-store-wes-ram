version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: homelab-transmission-vpn_gluetun_1
      APP_PORT: 9091

  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Configure this variable through the Umbrel app environment settings.
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "9091"
      SERVER_COUNTRIES: "Brazil,Netherlands,United States"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
    volumes:
      - ${APP_DATA_ROOT}/gluetun:/gluetun
    restart: unless-stopped

  transmission:
    image: linuxserver/transmission:4.1.3
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_ROOT}/config:/config
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    restart: unless-stopped

  port-sync:
    image: python:3.12-alpine
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - transmission
    environment:
      GLUETUN_PORT_FILE: /gluetun/forwarded_port
      TRANSMISSION_RPC_URL: http://127.0.0.1:9091/transmission/rpc
      PORT_SYNC_POLL_SECONDS: "5"
    volumes:
      - ${APP_DATA_ROOT}/gluetun:/gluetun:ro
    command:
      - /bin/sh
      - -c
      - |
        until wget -qO /tmp/port-sync.py https://raw.githubusercontent.com/wesllyramiro/umbrel-homelab-store-wes-ram/master/homelab-transmission-vpn/port-sync.py; do
          echo "Aguardando acesso ao script de sincronização..."
          sleep 5
        done
        exec python -u /tmp/port-sync.py
    restart: unless-stopped
